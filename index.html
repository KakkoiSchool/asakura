<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakkoi-Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 3rem;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            margin-bottom: 20px;
        }
        #game-container {
            width: 800px;
            height: 600px;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #save-btn {
            background: transparent;
            border: 2px solid #ff0055;
            color: #ff0055;
            padding: 8px 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 8px #ff0055;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        #save-btn:hover {
            background: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 18px #ff0055;
        }
        #load-btn {
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 8px #00ffcc;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        #load-btn:hover {
            background: #00ffcc;
            color: #000000;
            box-shadow: 0 0 18px #00ffcc;
        }
        .btn-container {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>
    <h1>kakkoi-game</h1>
    <div id="game-container">
        <canvas id="world" width="640" height="480"></canvas>
    </div>
    <div class="btn-container">
        <button id="save-btn">セーブ (Save)</button>
        <button id="load-btn">ロード (Load)</button>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
